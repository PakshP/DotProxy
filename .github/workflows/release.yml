name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build DotProxy.jar
        run: |
          chmod +x gradlew
          RELEASE_TAG="${GITHUB_REF_NAME#v}" ./gradlew shadowJar --no-configuration-cache
          ls -l build/libs/DotProxy.jar

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            build/libs/DotProxy.jar \
            scripts/start.sh \
            scripts/start.bat \
            --title "DotProxy $GITHUB_REF_NAME" \
            --generate-notes
